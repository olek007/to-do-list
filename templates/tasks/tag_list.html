{% extends "base.html" %}

{% block content %}
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-10">
        <h1>Tags</h1>
      </div>
      <div class="col-sm-2">
        <a class="btn btn-primary" href="{% url 'tasks:tag-create' %}">Add</a>
      </div>
    </div>
  </div>
  <table class="table">
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Update</th>
        <th scope="col">Delete</th>
      </tr>
    </thead>
      {% for tag in tags %}
      <tr>
          <td>{{ tag.name }}</td>

          <td><a class="btn btn-secondary" href="{% url 'tasks:tag-update' pk=tag.id %}">Update</a></td>

          <td><a class="btn btn-secondary" href="{% url 'tasks:tag-delete' pk=tag.id %}">Delete</a></td>

      </tr>
      {% endfor %}
    </table>
{% endblock %}
